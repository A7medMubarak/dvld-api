name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Backend build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ./DVLD.sln

      - name: Build
        run: dotnet build ./DVLD.sln --no-restore --configuration Release --nologo

      - name: Test
        run: dotnet test ./DVLD.sln --no-build --configuration Release

  deploy:
    name: Deploy API to Monster
    needs: build-and-test
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        # win-x64: in-process hosting requires the bitness to match the app pool,
        # and shared-hosting pools are 64-bit by default (win-x86 crashed w3wp).
        run: dotnet publish ./src/DVLD.Api/DVLD.Api.csproj -c Release -r win-x64 --no-self-contained -o ./publish

      - name: Deploy via Web Deploy
        shell: powershell
        env:
          PUBXML: ${{ secrets.MONSTER_PUBLISH_PROFILE }}
        run: |
          $env:PUBXML | Set-Content -Path publish.pubxml -Encoding utf8
          [xml]$profileXml = Get-Content publish.pubxml -Raw
          $publishUrl = $profileXml.publishData.publishProfile.publishUrl
          $siteName = $profileXml.publishData.publishProfile.msdeploySite
          $userName = $profileXml.publishData.publishProfile.userName
          $password = $profileXml.publishData.publishProfile.userPWD
          $endpoint = "https://${publishUrl}:8172/msdeploy.axd?site=${siteName}"

          $msdeploy = Get-ChildItem "$env:ProgramFiles\IIS" -Recurse -Filter msdeploy.exe -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName -First 1
          if (-not $msdeploy) {
            choco install webdeploy -y --no-progress | Out-Null
            $msdeploy = Get-ChildItem "$env:ProgramFiles\IIS" -Recurse -Filter msdeploy.exe -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName -First 1
          }
          if (-not $msdeploy) { throw "msdeploy.exe not found" }

          $source = Join-Path $env:GITHUB_WORKSPACE 'publish'
          & $msdeploy '-verb:sync' "-source:contentPath=$source" `
            "-dest:contentPath=$siteName,computerName=$endpoint,userName=$userName,password=$password,authtype=Basic,includeAcls=False" `
            -allowUntrusted -disableLink:AppPoolExtension -disableLink:ContentExtension -disableLink:CertificateExtension `
            -enableRule:AppOffline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
